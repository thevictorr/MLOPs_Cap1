name: CI + Trigger CodeBuild

on:
  push:
    branches: ["master"]

jobs:
  ci:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: make install

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  trigger-build:
    name: Trigger AWS CodeBuild
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Start CodeBuild
        run: |
          BUILD_ID=$(aws codebuild start-build \
            --project-name ${{ secrets.CODEBUILD_PROJECT_NAME }} \
            --source-version ${{ github.sha }} \
            --environment-variables-override \
              name=IMAGE_TAG,value=${{ github.sha }},type=PLAINTEXT \
            --query 'build.id' \
            --output text)

          echo "CodeBuild ID: $BUILD_ID"

          while true; do
            STATUS=$(aws codebuild batch-get-builds \
              --ids "$BUILD_ID" \
              --query 'builds[0].buildStatus' \
              --output text)

            echo "Current CodeBuild status: $STATUS"

            if [ "$STATUS" = "SUCCEEDED" ]; then
              exit 0
            fi

            if [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "FAULT" ] || [ "$STATUS" = "STOPPED" ] || [ "$STATUS" = "TIMED_OUT" ]; then
              exit 1
            fi

            sleep 15
          done
